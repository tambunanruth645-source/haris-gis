version: '3.8'

services:
  # 1. Spatial Database: PostgreSQL + PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: haris_gis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haris_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haris_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-haris_gis}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    networks:
      - haris_gis_net

  # 2. Vector Tile Server: Martin (Ultra-fast Rust MVT Server)
  tile-server:
    image: maplibre/martin:v0.13.0
    container_name: haris_gis_tileserver
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-haris_admin}:${POSTGRES_PASSWORD:-haris_secret_password}@db:5432/${POSTGRES_DB:-haris_gis}
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - haris_gis_net

  # 3. Cache & Message Broker: Redis
  redis:
    image: redis:7-alpine
    container_name: haris_gis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - haris_gis_net

  # 4. S3-Compatible Object Storage for Uploaded Shapefiles/GeoJSON: MinIO
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: haris_gis_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-haris_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-haris_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - haris_gis_net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  haris_gis_net:
    driver: bridge
